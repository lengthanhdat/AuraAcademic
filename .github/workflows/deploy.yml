name: Deploy Frontend (S3 + CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to AWS S3
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Node.js 20
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Cài dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Tạo file .env với giá trị từ GitHub Secrets
      - name: Create .env.local
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_AI_URL=${{ secrets.NEXT_PUBLIC_AI_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          EOF

      # 5. Build Next.js → output vào thư mục /out
      - name: Build Next.js (static export)
        run: |
          sed -i 's/\/\/ output: '"'"'export'"'"'/output: '"'"'export'"'"'/' next.config.mjs
          sed -i 's/\/\/ trailingSlash: true/trailingSlash: true/' next.config.mjs
          npm run build
          mkdir -p out
          echo '<meta http-equiv="refresh" content="0; url=/vi" />' > out/index.html

      # 6. Cấu hình AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1  # Singapore — gần Việt Nam nhất

      # 7. Sync toàn bộ thư mục out/ lên S3
      - name: Deploy to S3
        run: |
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

          # HTML files: không cache (để user luôn lấy phiên bản mới nhất)
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html"

      # 8. Xóa cache CloudFront để user thấy phiên bản mới ngay
      - name: Invalidate CloudFront cache
        continue-on-error: true
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: ✅ Deploy complete
        run: echo "Frontend deployed to https://${{ secrets.CLOUDFRONT_DOMAIN }}"
